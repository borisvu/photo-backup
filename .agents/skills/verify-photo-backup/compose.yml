# Isolated S3 stand-in for verify-photo-backup. Own compose project (set by lib.sh), own volume,
# NO container_name, so it never collides with the functional tests' named containers.
# The repo's tests use minio/minio:latest, which Docker Hub no longer serves (pull access denied,
# checked 2026-11-13); quay.io/minio/minio refuses anonymous pulls. pgsty/minio is the community
# build of the same server and ships mc + curl. Pinned by digest.
#
# TLS on purpose: production is Wasabi over HTTPS, and engine._build_rclone_config() never emits
# http:// (it strips the scheme and ignores use_ssl), so a plain-HTTP stand-in cannot carry a sync.
# MINIO_DOMAIN enables virtual-host addressing, which rclone uses with provider = Wasabi
# (https://<bucket>.localhost:<port>/...). up.sh writes a throwaway CA-less self-signed cert into
# the run dir; the app trusts it only through RCLONE_CA_CERT.
services:
  minio:
    image: pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372   # RELEASE.2026-08-04T00-00-00Z
    command: ["minio", "server", "/data", "--console-address", ":9001", "--certs-dir", "/certs"]
    environment:
      MINIO_ROOT_USER: minioadmin          # same hardcoded test credentials as TEST_MODE_DEFAULTS
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DOMAIN: localhost
    ports:
      - "127.0.0.1:${VERIFY_MINIO_PORT:-59000}:9000"
    volumes:
      - data:/data
      - ${VERIFY_CERTS_DIR:-./no-certs}:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS https://localhost:9000/minio/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  data:
