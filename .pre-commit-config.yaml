# Same tools and versions as CI (.github/workflows/ci.yml): everything runs from uv.lock.
# Install with: uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy photo_backup
        language: system
        pass_filenames: false
        files: ^(photo_backup/.*\.py|pyproject\.toml)$
